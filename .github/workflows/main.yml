name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INFURA_PROJECT_ID: '00000000000'
  TZ: UTC

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn verify-locales --quiet
      - run: yarn circular-deps:check
      - run: yarn legacy-background-api:check
      - run: yarn messenger-action-types:check

  unit:
    name: Unit tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn test:unit --shard=${{ matrix.shard }}/6 --maxWorkers=2
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: unit-results-${{ matrix.shard }}
          path: test/test-results/junit.xml
          retention-days: 7

  integration:
    name: Integration and build-tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn test:unit:webpack
      - run: yarn test:integration --runInBand
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: integration-results
          path: test/test-results/integration
          retention-days: 7

  storybook:
    name: Component tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn playwright install --with-deps chromium
      - run: yarn test-storybook:ci

  build:
    name: LavaMoat test build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            command: yarn build:test
          - browser: firefox
            command: yarn build:test:mv2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v6
        with:
          name: test-build-${{ matrix.browser }}
          path: dist/${{ matrix.browser }}
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }}, shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SELENIUM_HEADLESS: 'true'
      SE_FORCE_BROWSER_DOWNLOAD: 'true'
      SE_SKIP_BROWSER_IN_PATH: 'true'
      SE_SKIP_DRIVER_IN_PATH: 'true'
      MATRIX_INDEX: ${{ matrix.shard }}
      MATRIX_TOTAL: '8'
      TEST_SUITE_NAME: test-e2e-${{ matrix.browser }}-webpack
      JOB_NAME: test-e2e-${{ matrix.browser }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn foundryup
      - uses: actions/download-artifact@v7
        with:
          name: test-build-${{ matrix.browser }}
          path: dist/${{ matrix.browser }}
      - name: Test latest stable browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: yarn "test:e2e:${TEST_BROWSER}"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            test-artifacts
            test/test-results/e2e
          retention-days: 7
